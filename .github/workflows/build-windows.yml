
name: Build LTA Crystalize VST3

on:
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target LTA_Crystalize_VST3

      - name: Package plugin
        shell: pwsh
        run: |
          $plugin = "build/LTA_Crystalize_artefacts/Release/VST3/LTA Crystalize.vst3"
          Compress-Archive -Path $plugin -DestinationPath "LTA_Crystalize_VST3_Windows.zip" -Force

      - name: Upload finished VST3
        uses: actions/upload-artifact@v4
        with:
          name: LTA-Crystalize-Windows-VST3
          path: LTA_Crystalize_VST3_Windows.zip
